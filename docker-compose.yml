services:
  deepseek4free:
    build: .
    image: blastbeng/deepseek4free:latest
    # Always build locally; never pull the image from a registry
    pull_policy: build
    container_name: deepseek4free
    # Lifecycle managed by systemd (docker-compose@.service)
    restart: no
    ports:
      - "${DSF_PORT:-8000}:8000"
    environment:
      # Your DeepSeek userToken (JSON.parse(localStorage.getItem("userToken")).value)
      - DEEPSEEK_AUTH_TOKEN=${DEEPSEEK_AUTH_TOKEN:-}
      # Optional: require clients to send this as their API key
      - DSF_API_KEY=${DSF_API_KEY:-}
      # Optional: override model names exposed on /v1/models
      - DSF_MODEL_THINKER=${DSF_MODEL_THINKER:-deepseek-reasoner}
      - DSF_MODEL_FAST=${DSF_MODEL_FAST:-deepseek-chat}
      - DSF_MODEL_SEARCH=${DSF_MODEL_SEARCH:-deepseek-search}
      # Gemini web-chat session cookies (reverse-engineered, no official API key)
      - GEMINI_1PSID=${GEMINI_1PSID:-}
      - GEMINI_1PSIDTS=${GEMINI_1PSIDTS:-}
      # ChatGPT web session (reverse-engineered, no official API key)
      - CHATGPT_ACCESS_TOKEN=${CHATGPT_ACCESS_TOKEN:-}
      - CHATGPT_SESSION_COOKIES=${CHATGPT_SESSION_COOKIES:-}
      # New reverse-engineered web providers (see .env.example for details)
      - CLAUDE_SESSION_KEY=${CLAUDE_SESSION_KEY:-}
      - CLAUDE_COOKIES=${CLAUDE_COOKIES:-}
      - GROK_SSO=${GROK_SSO:-}
      - GROK_COOKIES=${GROK_COOKIES:-}
      - MISTRAL_SESSION_TOKEN=${MISTRAL_SESSION_TOKEN:-}
      - MISTRAL_COOKIES=${MISTRAL_COOKIES:-}
      - QWEN_TOKEN=${QWEN_TOKEN:-}
      - QWEN_UMID=${QWEN_UMID:-}
      - QWEN_BX_UA=${QWEN_BX_UA:-}
      - QWEN_COOKIES=${QWEN_COOKIES:-}
      - KIMI_TOKEN=${KIMI_TOKEN:-}
      - KIMI_COOKIES=${KIMI_COOKIES:-}
      - COPILOT_COOKIES=${COPILOT_COOKIES:-}
      - PERPLEXITY_COOKIES=${PERPLEXITY_COOKIES:-}
      - GLM_REFRESH_TOKEN=${GLM_REFRESH_TOKEN:-}
      - GLM_COOKIES=${GLM_COOKIES:-}
      - DSF_PROVIDERS=${DSF_PROVIDERS:-}
      - DSF_ZAI_BROWSER=${DSF_ZAI_BROWSER:-true}
      - DSF_ZAI_HEADLESS=${DSF_ZAI_HEADLESS:-false}
      - DSF_ZAI_START_TIMEOUT=${DSF_ZAI_START_TIMEOUT:-90}
      - DSF_ZAI_IDLE_TIMEOUT=${DSF_ZAI_IDLE_TIMEOUT:-60}
      - DSF_ZAI_TOTAL_TIMEOUT=${DSF_ZAI_TOTAL_TIMEOUT:-300}
      - DSF_ZAI_BUSY_TIMEOUT=${DSF_ZAI_BUSY_TIMEOUT:-180}
      - DSF_ZAI_MODELS_TTL=${DSF_ZAI_MODELS_TTL:-900}
      - DSF_HTTP_CONNECT_TIMEOUT=${DSF_HTTP_CONNECT_TIMEOUT:-15}
      - DSF_COPILOT_HARVEST=${DSF_COPILOT_HARVEST:-true}
      # Dynamic model discovery TTL + fallback chains
      - DSF_MODELS_TTL=${DSF_MODELS_TTL:-300}
      - DSF_FALLBACKS=${DSF_FALLBACKS:-}
      - DSF_DEFAULT_FALLBACKS=${DSF_DEFAULT_FALLBACKS:-glm-4.7}
      # Outbound proxy rotation (dsk/proxies.py): fast-only free proxies + direct
      - DSF_PROXY=${DSF_PROXY:-}
      - DSF_PROXIES=${DSF_PROXIES:-}
      - DSF_PROXY_MAX_LATENCY=${DSF_PROXY_MAX_LATENCY:-1200}
      - DSF_PROXY_DIRECT=${DSF_PROXY_DIRECT:-true}
      - DSF_LLMTRIM=${DSF_LLMTRIM:-true}
      - DSF_PROXY_AUTO=${DSF_PROXY_AUTO:-false}
      - DSF_PROXY_SOURCES=${DSF_PROXY_SOURCES:-}
      - DSF_PROXY_MAX_POOL=${DSF_PROXY_MAX_POOL:-400}
      - DSF_PROXY_LIST_URL=${DSF_PROXY_LIST_URL:-}
      - DSF_PROXY_LIST_URLS=${DSF_PROXY_LIST_URLS:-}
      - DSF_PROXY_LIST_TTL=${DSF_PROXY_LIST_TTL:-1800}
      - DSF_PROXY_CHECK=${DSF_PROXY_CHECK:-false}
      - DSF_PROXY_CHECK_URL=${DSF_PROXY_CHECK_URL:-https://api.ipify.org?format=json}
      - DSF_PROXY_CHECK_TTL=${DSF_PROXY_CHECK_TTL:-1800}
      - DSF_PROXY_CHECK_TIMEOUT=${DSF_PROXY_CHECK_TIMEOUT:-8}
      - DSF_PROXY_CHECK_CONCURRENCY=${DSF_PROXY_CHECK_CONCURRENCY:-24}
      - DSF_PROXY_ENSURE_TIMEOUT=${DSF_PROXY_ENSURE_TIMEOUT:-90}
      - DSF_PROXY_MODE=${DSF_PROXY_MODE:-random}
      - DSF_PROXY_EXCLUDE=${DSF_PROXY_EXCLUDE:-}
      - DSF_PROXY_COOLDOWN=${DSF_PROXY_COOLDOWN:-120}
      - DSF_PROXY_ROTATE_TTL=${DSF_PROXY_ROTATE_TTL:-300}
      # Self-maintenance: upstream-breakage detection + LLM auto-patch
      # (dsk/selfheal.py); audit trail under /data/selfheal
      - DSF_SELFHEAL=${DSF_SELFHEAL:-true}
      - DSF_SELFHEAL_PROBE_TTL=${DSF_SELFHEAL_PROBE_TTL:-600}
      - DSF_SELFHEAL_TRIGGER=${DSF_SELFHEAL_TRIGGER:-3}
      - DSF_SELFHEAL_COOLDOWN=${DSF_SELFHEAL_COOLDOWN:-3600}
      - DSF_SELFHEAL_MAX_ATTEMPTS=${DSF_SELFHEAL_MAX_ATTEMPTS:-3}
      - DSF_SELFHEAL_MAX_INCIDENTS=${DSF_SELFHEAL_MAX_INCIDENTS:-4}
      - DSF_SELFHEAL_EXCLUDE=${DSF_SELFHEAL_EXCLUDE:-}
      - DSF_SELFHEAL_FIXER_BASE_URL=${DSF_SELFHEAL_FIXER_BASE_URL:-}
      - DSF_SELFHEAL_FIXER_API_KEY=${DSF_SELFHEAL_FIXER_API_KEY:-}
      - DSF_SELFHEAL_FIXER_MODELS=${DSF_SELFHEAL_FIXER_MODELS:-}
      - DSF_OPENROUTER_API_KEY=${DSF_OPENROUTER_API_KEY:-}
      - DSF_SELFHEAL_OPENROUTER_KEY=${DSF_SELFHEAL_OPENROUTER_KEY:-}
      - DSF_SELFHEAL_OPENROUTER_MODELS=${DSF_SELFHEAL_OPENROUTER_MODELS:-}
      - DSF_SELFHEAL_LOCAL=${DSF_SELFHEAL_LOCAL:-true}
      # Credential renewal bot (dsk/refresher.py): keeps jars/tokens fresh
      - DSF_REFRESHER=${DSF_REFRESHER:-true}
      - DSF_REFRESHER_TTL=${DSF_REFRESHER_TTL:-21600}
      - DSF_REFRESHER_COOLDOWN=${DSF_REFRESHER_COOLDOWN:-1800}
      - DSF_REFRESHER_MAX_RENEWS=${DSF_REFRESHER_MAX_RENEWS:-6}
      - DSF_REFRESHER_EXCLUDE=${DSF_REFRESHER_EXCLUDE:-}
      - DSF_REFRESHER_LOGIN=${DSF_REFRESHER_LOGIN:-true}
      - DSF_REFRESHER_HEADLESS=${DSF_REFRESHER_HEADLESS:-true}
      - DSF_REFRESHER_AUTOSIGNUP=${DSF_REFRESHER_AUTOSIGNUP:-true}
      - DSF_SIGNUP_PROXY=${DSF_SIGNUP_PROXY:-}
      - DEEPSEEK_LOGIN_EMAIL=${DEEPSEEK_LOGIN_EMAIL:-}
      - DEEPSEEK_LOGIN_PASSWORD=${DEEPSEEK_LOGIN_PASSWORD:-}
      - GEMINI_LOGIN_EMAIL=${GEMINI_LOGIN_EMAIL:-}
      - GEMINI_LOGIN_PASSWORD=${GEMINI_LOGIN_PASSWORD:-}
      - CHATGPT_LOGIN_EMAIL=${CHATGPT_LOGIN_EMAIL:-}
      - CHATGPT_LOGIN_PASSWORD=${CHATGPT_LOGIN_PASSWORD:-}
      - DSF_MAIL_AUTOGEN=${DSF_MAIL_AUTOGEN:-true}
      - DSF_MAIL_DOMAIN=${DSF_MAIL_DOMAIN:-}
      - DSF_MAIL_IMAP_HOST=${DSF_MAIL_IMAP_HOST:-}
      - DSF_MAIL_IMAP_PORT=${DSF_MAIL_IMAP_PORT:-993}
      - DSF_MAIL_IMAP_USER=${DSF_MAIL_IMAP_USER:-}
      - DSF_MAIL_IMAP_PASS=${DSF_MAIL_IMAP_PASS:-}
      - DSF_MAIL_OTP_SENDER=${DSF_MAIL_OTP_SENDER:-deepseek}
      - DSF_MAIL_OTP_MAX_AGE=${DSF_MAIL_OTP_MAX_AGE:-30}
      - DSF_MAIL_OTP_REGEX=${DSF_MAIL_OTP_REGEX:-}
      - DOCKERMODE=true
    extra_hosts:
      # host-gateway access for host-published operator services (the
      # proxy pool no longer uses Tor anywhere)
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist cf_clearance cookies across container restarts (local ./data dir)
      - ./data:/data
    shm_size: "1gb"
