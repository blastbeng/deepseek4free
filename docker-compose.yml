services:
  deepseek4free:
    build: .
    image: blastbeng/deepseek4free:latest
    # Always build locally; never pull the image from a registry
    pull_policy: build
    container_name: deepseek4free
    # Lifecycle managed by systemd (docker-compose@.service)
    restart: no
    ports:
      - "${DSF_PORT:-8000}:8000"
    environment:
      # Your DeepSeek userToken (JSON.parse(localStorage.getItem("userToken")).value)
      - DEEPSEEK_AUTH_TOKEN=${DEEPSEEK_AUTH_TOKEN:-}
      # Optional: require clients to send this as their API key
      - DSF_API_KEY=${DSF_API_KEY:-}
      # Optional: override model names exposed on /v1/models
      - DSF_MODEL_THINKER=${DSF_MODEL_THINKER:-deepseek-reasoner}
      - DSF_MODEL_FAST=${DSF_MODEL_FAST:-deepseek-chat}
      - DSF_MODEL_SEARCH=${DSF_MODEL_SEARCH:-deepseek-search}
      # Gemini web-chat session cookies (reverse-engineered, no official API key)
      - GEMINI_1PSID=${GEMINI_1PSID:-}
      - GEMINI_1PSIDTS=${GEMINI_1PSIDTS:-}
      # ChatGPT web session (reverse-engineered, no official API key)
      - CHATGPT_ACCESS_TOKEN=${CHATGPT_ACCESS_TOKEN:-}
      - CHATGPT_SESSION_COOKIES=${CHATGPT_SESSION_COOKIES:-}
      # Dynamic model discovery TTL + fallback chains
      - DSF_MODELS_TTL=${DSF_MODELS_TTL:-300}
      - DSF_FALLBACKS=${DSF_FALLBACKS:-}
      - DSF_DEFAULT_FALLBACKS=${DSF_DEFAULT_FALLBACKS:-}
      - DOCKERMODE=true
    volumes:
      # Persist cf_clearance cookies across container restarts (local ./data dir)
      - ./data:/data
    shm_size: "1gb"