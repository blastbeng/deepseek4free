<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deepseek4free · playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%F0%9F%90%8B%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7;
    --user-bubble: #1f6feb33; --bot-bubble: #161b22;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: 400; }
  select, input[type="text"], input[type="number"], textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  select:focus, input:focus, textarea:focus { outline: 1px solid var(--accent); }
  #model { min-width: 230px; }
  .grow { flex: 1; }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: #da3633; border-color: #da3633; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .gear { display: none; }

  main { flex: 1; display: flex; min-height: 0; }
  #chat {
    flex: 1; overflow-y: auto; padding: 18px 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 78%; border-radius: 10px; padding: 10px 14px; white-space: pre-wrap;
         word-wrap: break-word; overflow-wrap: anywhere; position: relative; }
  .msg.user { align-self: flex-end; background: var(--user-bubble);
              border: 1px solid #1f6feb55; }
  .msg.bot  { align-self: flex-start; background: var(--bot-bubble);
              border: 1px solid var(--border); }
  .msg.error { align-self: center; background: #f8514915; border: 1px solid #f8514966;
               color: var(--err); font-family: var(--mono); font-size: 13px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px;
              text-transform: uppercase; letter-spacing: .5px; }
  .msg .copy { position: absolute; top: 5px; right: 6px; padding: 1px 7px; font-size: 11px;
               opacity: 0; transition: opacity .12s; }
  .msg:hover .copy { opacity: 1; }
  .msg.error .badge { border-color: var(--err); color: var(--err); }
  details.think { margin: 0 0 8px 0; border: 1px dashed var(--border);
                  border-radius: 6px; background: #0d111788; }
  details.think summary { cursor: pointer; padding: 4px 10px; color: var(--muted);
                          font-size: 12px; user-select: none; }
  details.think .body { padding: 6px 10px; color: var(--muted);
                        font-size: 13px; white-space: pre-wrap; }
  .msg pre { background: #0a0d12; border: 1px solid var(--border); border-radius: 6px;
             padding: 0; margin: 6px 0; overflow-x: auto; font-family: var(--mono); font-size: 13px; }
  .msg pre .lang { padding: 4px 10px; font-size: 10px; color: var(--muted); font-family: var(--mono);
                   text-transform: uppercase; letter-spacing: .6px; border-bottom: 1px solid var(--border); }
  .msg pre code { display: block; padding: 10px; background: none; }
  .msg code { font-family: var(--mono); font-size: 13px; background: #0a0d12;
              border-radius: 4px; padding: 1px 4px; }

  #settings {
    width: 290px; border-left: 1px solid var(--border); background: var(--panel);
    padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
  }
  #settings h2 { font-size: 12px; margin: 0; color: var(--muted);
                 text-transform: uppercase; letter-spacing: .8px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input[type="number"], .field select { width: 100%; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px;
           border: 1px solid var(--border); color: var(--muted); }
  .badge.on { color: var(--ok); border-color: var(--ok); }
  #health { cursor: default; max-width: 220px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  #health.ok { color: var(--ok); border-color: var(--ok); }
  #health.bad { color: var(--err); border-color: var(--err); }
  #health.wait { color: var(--warn); border-color: var(--warn); }
  #empty { align-self: center; text-align: center; color: var(--muted);
           padding: 30px 20px; }
  #empty .sugg { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  #empty .sugg button { font-size: 12px; }
  #stats { font-size: 11px; color: var(--muted); font-family: var(--mono); min-height: 15px; }
  #stats .pulse { color: var(--accent); animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  #thumbs { display: none; gap: 10px; flex-wrap: wrap; max-width: 1000px;
            margin: 0 auto 8px; align-items: flex-end; }
  .thumb { position: relative; line-height: 0; }
  .thumb img { height: 56px; border-radius: 6px; border: 1px solid var(--border); }
  .thumb button { position: absolute; top: -7px; right: -7px; padding: 0 6px; font-size: 10px;
                  line-height: 16px; border-radius: 9px; }
  #composer { display: flex; gap: 10px; align-items: flex-end; max-width: 1000px; margin: 0 auto; }
  #attach { font-size: 15px; }
  #prompt {
    flex: 1; resize: none; min-height: 44px; max-height: 200px;
    font: inherit; line-height: 1.45;
  }
  .hint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 6px; }

  /* chat-history sidebar (ChatGPT/llama.cpp-style), chats expire after 24 h */
  #sidebar { width: 250px; border-right: 1px solid var(--border); background: var(--panel);
             display: flex; flex-direction: column; gap: 10px; padding: 12px 10px; }
  #sidebar.closed { display: none; }
  #newchat { width: 100%; }
  #chatlist { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .chatitem { display: flex; align-items: center; gap: 6px; padding: 7px 8px;
              border: 1px solid transparent; border-radius: 8px; cursor: pointer; }
  .chatitem:hover { background: #21262d; }
  .chatitem.active { background: #1f6feb22; border-color: #1f6feb55; }
  .chatitem .ct { flex: 1; min-width: 0; }
  .chatitem .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatitem .tm { font-size: 10px; color: var(--muted); }
  .chatitem .del { padding: 0 6px; font-size: 11px; opacity: 0; }
  .chatitem:hover .del { opacity: 1; }
  .sbhint { font-size: 10px; color: var(--muted); text-align: center; }
  @media (max-width: 900px) {
    #sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: min(280px, 84vw); z-index: 40;
               transform: translateX(-105%); transition: transform .18s ease;
               box-shadow: 10px 0 30px #000a; }
    #sidebar.open { transform: none; }
  }

  @media (max-width: 760px) {
    .gear { display: inline-block; }
    #settings {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 88vw); z-index: 30;
      transform: translateX(105%); transition: transform .18s ease; box-shadow: -10px 0 30px #000a;
    }
    #settings.open { transform: none; }
    .msg { max-width: 95%; }
    #model { max-width: 44vw; min-width: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>deepseek4free <span>· playground</span></h1>
  <select id="model" title="Model (from GET /v1/models)"></select>
  <span id="flags"></span>
  <span id="health" class="badge wait" title="GET /health">health…</span>
  <div class="grow"></div>
  <button id="sbtoggle" title="Toggle chat history">☰</button>
  <button id="regen" title="Regenerate the last reply" disabled>↺ retry</button>
  <button id="edit" title="Load the last user message back into the composer" disabled>✎ edit</button>
  <button id="export" title="Export conversation as markdown">⬇</button>
  <button id="gear" class="gear" title="Settings">⚙ settings</button>
  <button id="refresh" title="Reload model list">↻ models</button>
  <button id="clear" title="Clear conversation">✕ clear</button>
</header>
<main>
  <aside id="sidebar">
    <button id="newchat" class="primary">＋ New chat</button>
    <div id="chatlist"></div>
    <div class="sbhint">saved in this browser · chats expire after 24 h</div>
  </aside>
  <div id="chat"></div>
  <aside id="settings">
    <h2>Settings</h2>
    <div class="field">
      <label for="system">System message</label>
      <textarea id="system" rows="4" placeholder="You are a helpful assistant."></textarea>
    </div>
    <div class="field">
      <div class="row"><label for="temp">temperature</label><span id="tempVal" class="badge">1.00</span></div>
      <input type="range" id="temp" min="0" max="2" step="0.05" value="1" style="width:100%">
    </div>
    <div class="field">
      <label for="maxtok">max tokens (0 = default)</label>
      <input type="number" id="maxtok" min="0" step="256" value="0">
    </div>
    <div class="field">
      <div class="row">
        <label for="search">web search <span class="badge">extra</span></label>
        <input type="checkbox" id="search">
      </div>
      <div class="row">
        <label for="fastmode" title="Send thinking:false — thinking routes skip their reasoning pass and answer much faster">fast mode <span class="badge">no thinking</span></label>
        <input type="checkbox" id="fastmode">
      </div>
      <div class="row">
        <label for="showthink">show thinking</label>
        <input type="checkbox" id="showthink" checked>
      </div>
      <div class="row">
        <label for="noproxy" title="Skip the proxy pool for these requests (disable_proxy)">direct connection <span class="badge">no proxy</span></label>
        <input type="checkbox" id="noproxy">
      </div>
    </div>
    <div id="stats"></div>
  </aside>
</main>
<footer>
  <div id="thumbs"></div>
  <div id="composer">
    <button id="attach" title="Attach image(s) — or paste from clipboard">📎</button>
    <textarea id="prompt" placeholder="Send a message… (Enter to send, Shift+Enter for newline, paste/attach images)"></textarea>
    <button id="stop" class="danger" disabled>■ stop</button>
    <button id="send" class="primary">Send</button>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </div>
  <div class="hint">OpenAI-compatible endpoint · <span id="baseurl"></span></div>
</footer>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const chat = $('chat'), modelSel = $('model'), flagsEl = $('flags');
const LS_KEY = 'dsk_pg_v2';      // multi-chat store (sidebar history)
const LS_LEGACY = 'dsk_pg_v1';   // pre-sidebar single-conversation store
const CHAT_TTL = 24 * 60 * 60 * 1000;  // saved chats expire after one day
let messages = [];          // {role, content} — content: string | [{type:text|image_url}] (active chat's array)
let chats = [];             // [{id, title, created, updated, messages}]
let activeId = null;
let pendingImages = [];     // data URLs awaiting send
let controller = null;      // AbortController for the active stream
let modelInfo = {};         // id -> {thinking_enabled, search_enabled, vision, ...}
let statTimer = null, statT0 = 0, statChunks = 0, statChars = 0;

$('baseurl').textContent = location.origin;

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function contentText(c) {
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) {
    return c.map(p => p && p.type === 'text' ? p.text
      : (p && p.type === 'image_url' ? '[image]' : '')).filter(Boolean).join('\n');
  }
  return '';
}

// Minimal markdown: fenced code (with language label), inline code,
// bold/italic, links, headings, lists, hr — all escaped first, so no XSS.
function renderMd(text) {
  const parts = String(text).split(/```/);
  let html = '';
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {                       // code fence block
      let seg = parts[i], lang = '';
      const nl = seg.indexOf('\n');
      if (nl >= 0) {
        const first = seg.slice(0, nl).trim();
        if (/^[A-Za-z0-9_+#.\-]{1,20}$/.test(first)) { lang = first; seg = seg.slice(nl + 1); }
      }
      html += '<pre>' + (lang ? '<div class="lang">' + esc(lang) + '</div>' : '') +
              '<code>' + esc(seg.replace(/\n$/, '')) + '</code></pre>';
    } else {
      const lines = esc(parts[i]).split('\n');
      let out = '', inList = null;           // null | 'ul' | 'ol'
      const closeList = () => { if (inList) { out += '</' + inList + '>'; inList = null; } };
      for (const line of lines) {
        let t = line;
        let li = null;
        let m;
        if (/^\s*$/.test(t)) { closeList(); continue; }
        if (/^\s*(-{3,}|\*{3,})\s*$/.test(t)) { closeList(); out += '<hr>'; continue; }
        if ((m = t.match(/^\s*(#{1,4})\s+(.*\S)\s*$/))) {
          closeList();
          const lvl = m[1].length;
          out += '<b style="font-size:' + (17 - lvl) + 'px">' + inline(m[2]) + '</b>';
          continue;
        }
        if ((m = t.match(/^(\s*)[-*+]\s+(.*\S)\s*$/))) { li = 'ul'; }
        else if ((m = t.match(/^(\s*)\d+[.)]\s+(.*\S)\s*$/))) { li = 'ol'; }
        if (li) {
          if (inList !== li) { closeList(); out += '<' + li + ' style="margin:4px 0;padding-left:22px">'; inList = li; }
          out += '<li>' + inline(m[2]) + '</li>';
          continue;
        }
        closeList();
        out += inline(t) + '<br>';
      }
      closeList();
      html += out.replace(/(<br>)+$/, '');
    }
  }
  return html;

  function inline(t) {
    t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    t = t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<i>$2</i>');
    t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  }
}

function setRaw(body, text) {
  body.dataset.raw = text;
  body.innerHTML = renderMd(text);
}

function addBubble(role) {
  const root = document.createElement('div');
  root.className = 'msg ' + (role === 'error' ? 'error' : role);
  const body = document.createElement('div');
  body.className = 'body';
  if (role !== 'error') {
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role;
    root.appendChild(who);
  }
  if (role === 'bot' || role === 'user') {
    const cp = document.createElement('button');
    cp.className = 'copy'; cp.title = 'Copy'; cp.textContent = '⧉';
    cp.onclick = () => {
      navigator.clipboard.writeText(body.dataset.raw || body.textContent || '').then(() => {
        cp.textContent = '✓';
        setTimeout(() => { cp.textContent = '⧉'; }, 1200);
      }).catch(() => {});
    };
    root.appendChild(cp);
  }
  root.appendChild(body);
  chat.appendChild(root);
  chat.scrollTop = chat.scrollHeight;
  return { root, body };
}

function errorBubble(msg, type, code) {
  const b = addBubble('error');
  let html = '⚠ ' + esc(msg || 'unknown error');
  const badges = [];
  if (type) badges.push('<span class="badge">' + esc(String(type)) + '</span>');
  if (code !== undefined && code !== null && code !== '') badges.push('<span class="badge">' + esc(String(code)) + '</span>');
  if (badges.length) html += ' &nbsp;' + badges.join(' ');
  b.body.innerHTML = html;
}

function thinkBlock(parent) {
  const det = document.createElement('details');
  det.className = 'think';
  det.open = $('showthink').checked;
  det.innerHTML = '<summary>🧠 thinking</summary><div class="body"></div>';
  parent.prepend(det);
  return det.querySelector('.body');
}

async function loadModels() {
  modelSel.innerHTML = '<option value="">loading…</option>';
  try {
    const r = await fetch('/v1/models');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    modelInfo = {};
    modelSel.innerHTML = '';
    for (const m of data.data || []) {
      modelInfo[m.id] = m;
      const opt = document.createElement('option');
      opt.value = m.id;
      const bits = [];
      if (m.thinking_enabled) bits.push('🧠');
      if (m.search_enabled) bits.push('🔍');
      if (m.vision) bits.push('📷');
      if (m.image_gen) bits.push('🎨');
      opt.textContent = m.id + (bits.length ? '  ' + bits.join(' ') : '');
      modelSel.appendChild(opt);
    }
    if (!modelSel.options.length) {
      modelSel.innerHTML = '<option value="">(no models available)</option>';
    }
    const want = modelSel.dataset.want;
    if (want && modelInfo[want]) modelSel.value = want;
    delete modelSel.dataset.want;
    updateFlags();
  } catch (e) {
    modelSel.innerHTML = '<option value="">failed to load models</option>';
  }
}

function updateFlags() {
  const m = modelInfo[modelSel.value];
  if (!m) { flagsEl.innerHTML = ''; return; }
  const f = [];
  f.push('<span class="badge">ctx ' + (m.context_length || '?') + '</span>');
  f.push('<span class="badge">out ' + (m.max_tokens || m.max_completion_tokens || '?') + '</span>');
  if (m.thinking_enabled) f.push('<span class="badge on">thinking</span>');
  if (m.search_enabled) f.push('<span class="badge on">search</span>');
  if (m.vision) f.push('<span class="badge on">vision</span>');
  if (m.image_gen) f.push('<span class="badge on">image gen</span>');
  if ((m.fallbacks || []).length) f.push('<span class="badge">fb: ' + m.fallbacks.join(', ') + '</span>');
  flagsEl.innerHTML = f.join(' ');
  $('attach').title = m.vision ? 'Attach image(s)'
    : 'Attach image(s) — current model has no vision, they will be rejected';
}

function setBusy(busy) {
  $('send').disabled = busy;
  $('stop').disabled = !busy;
}

function startStatus() {
  statT0 = performance.now(); statChunks = 0; statChars = 0;
  statTimer = setInterval(() => {
    const s = ((performance.now() - statT0) / 1000).toFixed(1);
    $('stats').innerHTML = '<span class="pulse">●</span> ' + s + 's · ' +
      statChunks + ' chunks · ' + statChars + ' chars';
  }, 200);
}

function stopStatus(kind) {
  if (statTimer) { clearInterval(statTimer); statTimer = null; }
  const secs = ((performance.now() - statT0) / 1000).toFixed(1);
  const cps = secs > 0 ? Math.round(statChars / secs) : 0;
  if (kind === 'done' && statChunks > 0) $('stats').textContent =
    'last: ' + secs + 's · ~' + statChunks + ' chunks · ' + statChars +
    ' chars · ' + cps + ' chars/s';
  else if (kind === 'stop') $('stats').textContent =
    'stopped: ' + secs + 's · ' + statChunks + ' chunks · ' + statChars + ' chars';
  else if (kind === 'error') $('stats').textContent = 'failed: ' + secs + 's';
}

// ---------- persistence: multi-chat store, chats expire after 24 h ----------
function settingsSnapshot() {
  return {
    model: modelSel.value,
    system: $('system').value,
    temp: $('temp').value,
    maxtok: $('maxtok').value,
    search: $('search').checked,
    showthink: $('showthink').checked,
    noproxy: $('noproxy').checked,
  };
}

function newChatObj() {
  return {
    id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    title: 'New chat', created: Date.now(), updated: Date.now(), messages: [],
  };
}

function activeChat() { return chats.find(c => c.id === activeId) || null; }

function firstUserText(msgs) {
  for (const m of msgs) {
    if (m.role !== 'user') continue;
    const t = contentText(m.content).replace(/\s+/g, ' ').trim();
    if (t) return t.slice(0, 60);
  }
  return '';
}

function prune() {   // drop chats untouched for > CHAT_TTL (a day)
  const cutoff = Date.now() - CHAT_TTL;
  chats = chats.filter(c => (c.updated || 0) >= cutoff);
}

function ensureActive() {
  if (activeChat()) return;
  const next = [...chats].sort((a, b) => (b.updated || 0) - (a.updated || 0))[0];
  if (next) { activeId = next.id; messages = next.messages; }
  else {
    const c = newChatObj();
    chats.push(c); activeId = c.id; messages = c.messages;
  }
  redraw();
}

function persist() {
  const cur = activeChat();
  if (cur) {
    // 'updated' tracks ACTIVITY, not passive views — a content fingerprint
    // (count + total size) also keeps regenerations (same message count,
    // different text) from letting an actively-used chat expire.
    const fp = messages.length + ':' + messages.reduce(
      (n, m) => n + (typeof m.content === 'string'
        ? m.content.length : JSON.stringify(m.content || '').length), 0);
    if (cur.fp !== fp) {
      cur.updated = Date.now();
      cur.fp = fp;
    }
    cur.messages = messages;
    const t = firstUserText(messages);
    cur.title = t || (messages.length ? (cur.title || 'New chat') : 'New chat');
  }
  prune();
  ensureActive();
  const pack = (chs, imgs) => JSON.stringify({
    v: 2, activeId, pendingImages: imgs, settings: settingsSnapshot(), chats: chs,
  });
  try {
    localStorage.setItem(LS_KEY, pack(chats, pendingImages));
  } catch (_) {
    try { // quota exceeded: drop image payloads, keep text
      const slim = chats.map(c => Object.assign({}, c, { messages: c.messages.map(m =>
        typeof m.content === 'string' ? m : { role: m.role, content: contentText(m.content) }) }));
      localStorage.setItem(LS_KEY, pack(slim, []));
    } catch (_2) {}
  }
  renderSidebar();
}

function relTime(ts) {
  const d = Date.now() - (ts || 0);
  if (d < 60e3) return 'just now';
  if (d < 3600e3) return Math.round(d / 60e3) + 'm ago';
  if (d < 86400e3) return Math.round(d / 3600e3) + 'h ago';
  return Math.round(d / 86400e3) + 'd ago';
}

function renderSidebar() {
  const list = $('chatlist');
  if (!list) return;
  list.innerHTML = '';
  const sorted = [...chats].sort((a, b) => (b.updated || 0) - (a.updated || 0));
  for (const c of sorted) {
    const it = document.createElement('div');
    it.className = 'chatitem' + (c.id === activeId ? ' active' : '');
    const ct = document.createElement('div'); ct.className = 'ct';
    const t = document.createElement('div'); t.className = 't';
    t.textContent = c.title || 'New chat';
    const tm = document.createElement('div'); tm.className = 'tm';
    tm.textContent = relTime(c.updated);
    ct.appendChild(t); ct.appendChild(tm);
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = 'Delete chat';
    del.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
    it.appendChild(ct); it.appendChild(del);
    it.onclick = () => switchChat(c.id);
    list.appendChild(it);
  }
}

function redraw() {
  chat.innerHTML = '';
  for (const m of messages) {
    if (m.role === 'system') continue;
    const b = addBubble(m.role === 'assistant' ? 'bot' : m.role);
    setRaw(b.body, contentText(m.content));
  }
  refreshEmpty();
  refreshRegen();
}

function switchChat(id) {
  if (controller || id === activeId || !chats.some(c => c.id === id)) return;
  persist();                       // flush the current chat first
  activeId = id;
  messages = chats.find(c => c.id === id).messages;
  pendingImages = [];
  chat.innerHTML = '';
  redraw(); renderThumbs(); persist();
  $('sidebar').classList.remove('open');
}

function newChat() {
  if (controller) return;
  const cur = activeChat();
  if (cur && !cur.messages.length) {
    $('prompt').focus(); $('sidebar').classList.remove('open'); return;
  }
  persist();
  const c = newChatObj();
  chats.push(c);
  activeId = c.id;
  messages = c.messages;
  pendingImages = [];
  chat.innerHTML = ''; renderThumbs();
  $('stats').textContent = '';
  redraw(); persist();
  $('prompt').focus();
  $('sidebar').classList.remove('open');
}

function deleteChat(id) {
  if (controller) return;
  const idx = chats.findIndex(c => c.id === id);
  if (idx < 0) return;
  chats.splice(idx, 1);
  if (id === activeId) {
    activeId = null;
    ensureActive();
    chat.innerHTML = '';
    redraw(); renderThumbs();
  }
  persist();
}

function restoreAll() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (_) {}
  if (s && Array.isArray(s.chats)) {
    chats = s.chats.filter(c => c && Array.isArray(c.messages)).map(c => ({
      id: c.id || newChatObj().id,
      title: c.title || 'New chat',
      created: c.created || Date.now(),
      updated: c.updated || Date.now(),
      messages: c.messages.filter(m => m && m.role && m.content !== undefined),
    }));
    activeId = (s.activeId && chats.some(c => c.id === s.activeId)) ? s.activeId : null;
  } else {
    // migrate the legacy single-conversation store into one chat
    let old = null;
    try { old = JSON.parse(localStorage.getItem(LS_LEGACY) || 'null'); } catch (_) {}
    const c = newChatObj();
    if (old && Array.isArray(old.messages)) {
      c.messages = old.messages.filter(m => m && m.role && m.content !== undefined);
      c.title = firstUserText(c.messages) || 'New chat';
    }
    chats = [c];
    s = { settings: old || {}, pendingImages: (old && old.pendingImages) || [] };
    try { localStorage.removeItem(LS_LEGACY); } catch (_) {}
  }
  ensureActive();
  messages = activeChat().messages;  // always bind the global view to the active chat
  pendingImages = (s && Array.isArray(s.pendingImages)) ? s.pendingImages : [];
  const st = (s && s.settings) || {};
  if (typeof st.system === 'string') $('system').value = st.system;
  if (st.temp !== undefined) { $('temp').value = st.temp; $('tempVal').textContent = parseFloat(st.temp).toFixed(2); }
  if (st.maxtok !== undefined) $('maxtok').value = st.maxtok;
  if (typeof st.search === 'boolean') $('search').checked = st.search;
  if (typeof st.showthink === 'boolean') $('showthink').checked = st.showthink;
  if (typeof st.noproxy === 'boolean') $('noproxy').checked = st.noproxy;
  redraw();
  renderThumbs();
  if (st.model) modelSel.dataset.want = st.model;  // applied after loadModels()
  persist();
}

// ---------- image attach ----------
function renderThumbs() {
  const t = $('thumbs');
  t.innerHTML = '';
  pendingImages.forEach((u, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const img = document.createElement('img');
    img.src = u; img.alt = 'attachment';
    const x = document.createElement('button');
    x.textContent = '✕'; x.title = 'Remove';
    x.onclick = () => { pendingImages.splice(i, 1); renderThumbs(); persist(); };
    d.appendChild(img); d.appendChild(x);
    t.appendChild(d);
  });
  t.style.display = pendingImages.length ? 'flex' : 'none';
}

$('attach').onclick = () => $('file').click();
$('file').onchange = () => {
  const files = Array.from($('file').files || []);
  let chain = Promise.resolve();
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    if (f.size > 6 * 1024 * 1024) {
      errorBubble('Image "' + f.name + '" is too large (max 6 MB).', 'client', 'image_too_large');
      continue;
    }
    chain = chain.then(() => new Promise((ok) => {
      const r = new FileReader();
      r.onload = () => { pendingImages.push(r.result); ok(); };
      r.onerror = () => ok();
      r.readAsDataURL(f);
    }));
  }
  chain.then(() => { $('file').value = ''; renderThumbs(); persist(); });
};

// ---------- send / stream ----------
async function send() {
  const text = $('prompt').value.trim();
  if ((!text && !pendingImages.length) || controller) return;
  $('prompt').value = '';
  autoGrow();
  $('settings').classList.remove('open');

  if (messages.length === 0 && $('system').value.trim()) {
    messages.push({ role: 'system', content: $('system').value.trim() });
  }
  let content = text;
  if (pendingImages.length) {
    content = [{ type: 'text', text: text || 'Describe the image(s).' }];
    for (const url of pendingImages) content.push({ type: 'image_url', image_url: { url: url } });
  }
  const model = modelInfo[modelSel.value] || {};
  if (pendingImages.length && model.vision === false) {
    errorBubble('Model "' + modelSel.value + '" does not support vision — image(s) kept. Pick a 📷-flagged model.', 'client', 'model_does_not_support_vision');
    return;  // keep pendingImages so the user can switch models and resend
  }

  messages.push({ role: 'user', content });
  const ub = addBubble('user');
  ub.body.textContent = text + (pendingImages.length ? '\n🖼 ' + pendingImages.length + ' image(s)' : '');
  ub.body.dataset.raw = ub.body.textContent;
  persist();

  await runCompletion();
}

// Stream one assistant turn from the current `messages` tail. Shared by
// send() and the ↺ retry button.
async function runCompletion() {
  const b = addBubble('bot');
  const think = { el: null, text: '' };
  let answer = '';
  setBusy(true);
  startStatus();
  controller = new AbortController();
  try {
    const payload = {
      model: modelSel.value,
      messages: messages,
      stream: true,
      temperature: parseFloat($('temp').value),
    };
    if (parseInt($('maxtok').value, 10) > 0) payload.max_tokens = parseInt($('maxtok').value, 10);
    if ($('search').checked) payload.search_enabled = true;
    if ($('fastmode').checked) payload.thinking = false;
    if ($('noproxy').checked) payload.disable_proxy = true;

    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal,
    });
    if (!res.ok) {
      let msg = 'HTTP ' + res.status, type, code;
      try {
        const j = await res.json();
        if (j.error) { msg = j.error.message || msg; type = j.error.type; code = j.error.code; }
      } catch (_) {}
      throw Object.assign(new Error(msg), { errType: type, errCode: code });
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        let j;
        try { j = JSON.parse(data); } catch (_) { continue; }
        if (j.error) {
          throw Object.assign(new Error(j.error.message || 'stream error'),
            { errType: j.error.type, errCode: j.error.code });
        }
        const delta = j.choices?.[0]?.delta || {};
        if (delta.reasoning_content) {
          if (!think.el) think.el = thinkBlock(b.root);
          think.text += delta.reasoning_content;
          think.el.textContent = think.text;
          chat.scrollTop = chat.scrollHeight;
        }
        if (delta.content) {
          answer += delta.content;
          statChunks++; statChars += delta.content.length;
          setRaw(b.body, answer);
          chat.scrollTop = chat.scrollHeight;
        }
      }
    }
    messages.push({ role: 'assistant', content: answer });
    stopStatus('done');
  } catch (e) {
    if (e.name === 'AbortError') {
      const st = document.createElement('i');
      st.style.color = 'var(--warn)';
      st.textContent = ' [stopped]';
      b.body.appendChild(st);
      if (answer) messages.push({ role: 'assistant', content: answer });
      stopStatus('stop');
    } else {
      if (!answer && !think.text) b.root.remove();  // drop empty bot bubble
      errorBubble(e.message, e.errType, e.errCode);
      stopStatus('error');
    }
  } finally {
    setBusy(false);
    controller = null;
    persist();
    refreshRegen();
  }
}

function autoGrow() {
  const p = $('prompt');
  p.style.height = 'auto';
  p.style.height = Math.min(p.scrollHeight, 200) + 'px';
}

$('send').onclick = send;
$('stop').onclick = () => controller && controller.abort();
$('refresh').onclick = loadModels;
$('gear').onclick = () => $('settings').classList.toggle('open');
$('sbtoggle').onclick = () => {
  const sb = $('sidebar');
  if (window.matchMedia('(max-width: 900px)').matches) sb.classList.toggle('open');
  else sb.classList.toggle('closed');
};
$('newchat').onclick = newChat;
$('clear').onclick = () => {
  messages = []; pendingImages = [];
  chat.innerHTML = ''; renderThumbs();
  $('stats').textContent = '';
  persist();
};
$('prompt').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('prompt').addEventListener('input', autoGrow);

// ---------- clipboard image paste (vision testing without 📎) ----------
$('prompt').addEventListener('paste', (e) => {
  const files = Array.from((e.clipboardData && e.clipboardData.files) || [])
    .filter(f => f.type && f.type.startsWith('image/'));
  if (!files.length) return;
  e.preventDefault();
  let chain = Promise.resolve();
  for (const f of files) {
    chain = chain.then(() => new Promise((res) => {
      const r = new FileReader();
      r.onload = () => { pendingImages.push(r.result); res(); };
      r.onerror = res;
      r.readAsDataURL(f);
    }));
  }
  chain.then(() => { renderThumbs(); persist(); });
});
modelSel.addEventListener('change', () => { updateFlags(); persist(); });
for (const id of ['system', 'temp', 'maxtok', 'search', 'showthink', 'noproxy']) {
  $(id).addEventListener('change', persist);
  $(id).addEventListener('input', persist);
}
$('temp').addEventListener('input', () => {
  $('tempVal').textContent = parseFloat($('temp').value).toFixed(2);
});

// ---------- health pill (GET /health every 30s) ----------
async function pollHealth() {
  const el = $('health');
  try {
    const r = await fetch('/health', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const h = await r.json();
    const ok = h.status === 'ok';
    el.className = 'badge ' + (ok ? 'ok' : 'bad');
    el.title = 'GET /health\n' +
      'status: ' + JSON.stringify(h.status) + '\n' +
      'proxy: ' + JSON.stringify(h.proxy) + '\n' +
      'selfheal: ' + JSON.stringify(h.selfheal) + '\n' +
      'refresher: ' + JSON.stringify(h.refresher);
    el.textContent = ok ? 'healthy' : 'degraded';
  } catch (e) {
    el.className = 'badge bad';
    el.textContent = 'unreachable';
    el.title = 'GET /health failed: ' + e.message;
  }
}
setInterval(pollHealth, 30000);
pollHealth();

// Expire chats older than a day even while the tab stays open.
setInterval(() => { prune(); persist(); }, 5 * 60e3);

// ---------- regenerate last reply ----------
function canRegen() {
  return !controller && messages.some(m => m.role === 'user') &&
    messages[messages.length - 1]?.role === 'assistant';
}
function refreshRegen() {
  $('regen').disabled = !canRegen();
  $('edit').disabled = !!controller || !messages.some(m => m.role === 'user');
}
$('regen').onclick = async () => {
  if (!canRegen()) return;
  while (messages.length && messages[messages.length - 1].role === 'assistant') messages.pop();
  const bubbles = chat.querySelectorAll('.msg.bot, .msg.error');
  for (const b of bubbles) b.remove();
  persist();
  await runCompletion();
};

// ---------- edit last user message (tweak + resend) ----------
$('edit').onclick = () => {
  if (controller) return;
  while (messages.length && messages[messages.length - 1].role === 'assistant') messages.pop();
  for (const b of chat.querySelectorAll('.msg.bot, .msg.error')) b.remove();
  if (!messages.length || messages[messages.length - 1].role !== 'user') { refreshRegen(); return; }
  const m = messages.pop();
  const ubs = chat.querySelectorAll('.msg.user');
  if (ubs.length) ubs[ubs.length - 1].remove();
  pendingImages = [];
  if (Array.isArray(m.content)) {
    for (const part of m.content) {
      if (part && part.type === 'image_url' && part.image_url && part.image_url.url)
        pendingImages.push(part.image_url.url);
    }
  }
  $('prompt').value = typeof m.content === 'string' ? m.content : contentText(m.content);
  renderThumbs(); autoGrow(); persist(); refreshRegen();
  $('prompt').focus();
};

// ---------- export conversation as markdown ----------
$('export').onclick = () => {
  if (!messages.length) return;
  const lines = ['# deepseek4free conversation', '',
    '*model:* ' + (modelSel.value || '?') + ' · *exported:* ' +
    new Date().toISOString(), ''];
  for (const m of messages) {
    lines.push('## ' + (m.role === 'assistant' ? 'Assistant' :
      m.role === 'user' ? 'User' : 'System'), '');
    lines.push(typeof m.content === 'string' ? m.content : contentText(m.content), '');
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'deepseek4free-' + new Date().toISOString().slice(0, 19)
    .replace(/[:T]/g, '-') + '.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};

// ---------- empty state ----------
const SUGGESTIONS = [
  'Explain the Byzantine Generals problem like I am five',
  'Write a Python script that watches a folder and syncs it to S3',
  'Summarize the trade-offs between SQLite and Postgres',
];
function refreshEmpty() {
  let el = $('empty');
  const need = messages.length === 0 && !controller;
  if (need && !el) {
    el = document.createElement('div');
    el.id = 'empty';
    el.innerHTML = '<div style="font-size:34px">🐋</div>' +
      '<div>Pick a model and start chatting — replies stream live.</div>' +
      '<div class="sugg"></div>';
    const box = el.querySelector('.sugg');
    for (const s of SUGGESTIONS) {
      const b = document.createElement('button');
      b.textContent = s;
      b.onclick = () => { $('prompt').value = s; autoGrow(); $('prompt').focus(); };
      box.appendChild(b);
    }
    chat.appendChild(el);
  } else if (!need && el) el.remove();
}
const _refreshEmptyObserver = new MutationObserver(refreshEmpty);
_refreshEmptyObserver.observe(chat, { childList: true });
refreshEmpty();

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    $('settings').classList.remove('open');
    $('sidebar').classList.remove('open');
  }
});

restoreAll();
loadModels();
refreshRegen();
chat.addEventListener('DOMSubtreeModified', refreshRegen);
</script>
</body>
